<!-- Lightbox -->
<div id="lightbox" style="display:none;">
  <img id="lightbox-prev" src="images-ui-/pointerback.gif">
  <img id="lightbox-img"><video id="lightbox-vid" autoplay loop muted playsinline style="display:none;max-height:80vh;max-width:80vw;"></video>
<div id="lens">
</div>
  <img id="lightbox-next" src="images-ui-/pointfwrd.gif">
</div>


<script>


const images = Array.from(document.querySelectorAll(".gallery-item img"));
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const prevBtn = document.getElementById("lightbox-prev");
const nextBtn = document.getElementById("lightbox-next");

let currentIndex = 0;

/* Open */
images.forEach((img, index) => {
  img.addEventListener("click", () => {
    currentIndex = index;
    showImage();
    lightbox.style.display = "flex";
    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
  });
});

function showImage() {
  const src = images ? images[currentIndex].src : currentGroup[currentIndex];
  const vid = document.getElementById("lightbox-vid");
  if (src.endsWith(".webm") || src.endsWith(".mp4")) {
    lightboxImg.style.display = "none";
    vid.style.display = "block";
    vid.src = src;
    vid.play();
  } else {
    vid.style.display = "none";
    vid.src = "";
    lightboxImg.style.display = "block";
    lightboxImg.src = src;
  }
}


/* Close when clicking outside */
lightbox.addEventListener("click", e => {
  if (e.target === lightbox) {
    lightbox.style.display = "none";
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
  }
});

/* Navigation */
prevBtn.addEventListener("click", e => {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  showImage();
});

nextBtn.addEventListener("click", e => {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % images.length;
  showImage();
});

/* Keyboard */
document.addEventListener("keydown", e => {
  if (lightbox.style.display !== "flex") return;

  if (e.key === "ArrowRight") nextBtn.click();
  if (e.key === "ArrowLeft") prevBtn.click();
  if (e.key === "Escape") {
    lightbox.style.display = "none";
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
  }
});

const lens = document.getElementById("lens");


lightboxImg.addEventListener("mouseenter", () => {
  lens.style.display = "block";
  });

lightboxImg.addEventListener("mouseleave", () => {
  lens.style.display = "none";
});

const zoom = 10;

lightboxImg.addEventListener("mousemove", e => {
  const rect = lightboxImg.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const px = x / rect.width;
  const py = y / rect.height;

  const lensSize = 200;

  lens.style.display = "block";
  lens.style.left = e.clientX - lensSize / 2 + "px";
  lens.style.top  = e.clientY - lensSize / 2 + "px";

  lens.style.backgroundImage = `url(${lightboxImg.src})`;

  // FISHEYE DISTORTION
  const dx = px - 0.5;
  const dy = py - 0.5;
  const r = Math.sqrt(dx * dx + dy * dy);
  const distortion = Math.exp(-r * 4);

  const fx = px + dx * distortion * 0.5;
  const fy = py + dy * distortion * 0.5;

  lens.style.backgroundSize = `${zoom * 100}%`;
  lens.style.backgroundPosition =
    `${fx * 100}% ${fy * 100}%`;
});

lightboxImg.addEventListener("mouseleave", () => {
  lens.style.display = "none";
});

</script>
