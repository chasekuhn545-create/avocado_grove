<!-- Lightbox -->

<script>
const galleries = {
  body: [
    "photos/body/hair.webp",
   
    "photos/body/arms, abstracted.webp",
    
  
    "photos/body/Layer 1.avif",
    "photos/body/Layer 2.avif",
    
    
   
        { webm: "photos/body/theleginquestion.webm", mov: "photos/body/theleginquestion.mov" },
   
    "photos/body/handportraits-3.webp",
    "photos/body/handportraits-6.webp",
    "photos/body/handportraits-7.webp",
    "photos/body/handportraits-8.webp",
    "photos/body/handportraits.webp",
    
    "photos/body/cut.webm",
    "photos/body/pointerfinger1.webm",
   
    
  ],
  WILLARD: [
    "photos/WILLARD/prvw3.webp",
    "photos/WILLARD/prvw1.webp",
    "photos/WILLARD/prvw2.webp",
    "photos/WILLARD/prvw4.webp",
    "photos/WILLARD/prvw5.webp",
    "photos/WILLARD/prvw6.webp",
  ],

  flesh2: [ "photos/body/conditiontolive.webp",
"photos/body/cndtnspread2.webp", "photos/body/cyanxray.webp", "photos/body/retnalfrm.webp", "photos/body/spread.webp", "photos/body/slappy1.webp",
"photos/body/leg.webp", "photos/body/cndtnspread.webp", "photos/body/table.webp",
  ],

  windows: [
"photos/windows/window1.webp", "photos/windows/window2.webp", "photos/windows/window3.webp", "photos/windows/window4.webp", "photos/windows/window5.webp", "photos/windows/window6.webp", "photos/windows/window7.webp", "photos/windows/window8.webp",
  ],
};


const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const prevBtn = document.getElementById("lightbox-prev");
const nextBtn = document.getElementById("lightbox-next");



/* Open */
const triggers = document.querySelectorAll(".gallery-item img");

let currentGroup = [];
let currentIndex = 0;

triggers.forEach(img => {
  img.addEventListener("click", () => {
    if (img.dataset.link) {
      window.location.href = img.dataset.link;
      return;
    }

    const galleryName = img.dataset.gallery;
    if (!galleryName || !galleries[galleryName]) return;

    currentGroup = galleries[galleryName];
    currentIndex = 0;

    showImage();
    lightbox.style.display = "flex";
    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
  });
});

function showImage() {
  const src = currentGroup[currentIndex];
  const vid = document.getElementById("lightbox-vid");

  if (typeof src === "object") {
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    lightboxImg.style.display = "none";
    vid.style.display = "block";
    vid.src = isSafari ? src.mov : src.webm;
    vid.load();
vid.play().catch(() => {});
  } else if (src.endsWith(".webm") || src.endsWith(".mp4")) {
    lightboxImg.style.display = "none";
    vid.style.display = "block";
    vid.src = src;
    vid.load();
    vid.play();
  } else {
    vid.style.display = "none";
    vid.src = "";
    lightboxImg.style.display = "block";
    lightboxImg.src = src;
  }
}

/* Close when clicking outside */



/* Close when clicking outside */
lightbox.addEventListener("click", e => {
  if (e.target === lightbox) {
    lightbox.style.display = "none";
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
  }
});

/* Navigation */
prevBtn.addEventListener("click", e => {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + currentGroup.length) % currentGroup.length;
  showImage();
});

nextBtn.addEventListener("click", e => {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % currentGroup.length;
  showImage();
});

/* Keyboard */
document.addEventListener("keydown", e => {
  if (lightbox.style.display !== "flex") return;

  if (e.key === "ArrowRight") nextBtn.click();
  if (e.key === "ArrowLeft") prevBtn.click();
  if (e.key === "Escape") {
    lightbox.style.display = "none";
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
  }
});

const lens = document.getElementById("lens");


lightboxImg.addEventListener("mouseenter", () => {
  lens.style.display = "block";
  });

lightboxImg.addEventListener("mouseleave", () => {
  lens.style.display = "none";
});

const zoom = 8;

lightboxImg.addEventListener("mousemove", e => {
  const rect = lightboxImg.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const px = x / rect.width;
  const py = y / rect.height;

  const lensSize = 200;

  lens.style.display = "block";
  lens.style.left = e.clientX - lensSize / 2 + "px";
  lens.style.top  = e.clientY - lensSize / 2 + "px";

  lens.style.backgroundImage = `url(${lightboxImg.src})`;

  // FISHEYE DISTORTION
  const dx = px - 0.5;
  const dy = py - 0.5;
  const r = Math.sqrt(dx * dx + dy * dy);
  const distortion = Math.exp(-r * 4);

  const fx = px + dx * distortion * 0.5;
  const fy = py + dy * distortion * 0.5;

  lens.style.backgroundSize = `${zoom * 130}%`;
  lens.style.backgroundPosition =
    `${fx * 100}% ${fy * 100}%`;
});

lightboxImg.addEventListener("mouseleave", () => {
  lens.style.display = "none";
});
	// Force autoplay on header videos
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll('.h1buddy, .h1buddy2').forEach(el => {
    if (el.tagName === 'VIDEO') {
      el.play().catch(() => {});
    }
  });
});
</script>
