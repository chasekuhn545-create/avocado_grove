<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>download</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    background: #0a0a0a;
    color: #f0ede8;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1.5rem 3rem;
    min-height: 100vh;
  }

  #cover {
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    margin-bottom: 2.5rem;
  }

  #track-list {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .track-btn {
    display: block;
    width: 100%;
    padding: 0.85rem 1rem;
    background: none;
    border: 1px solid rgba(255,255,255,0.15);
    color: #f0ede8;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.25s, color 0.25s;
    -webkit-tap-highlight-color: transparent;
  }

  .track-btn:hover,
  .track-btn:active {
    border-color: rgba(255,255,255,0.55);
    color: #fff;
  }

  .track-num {
    font-style: normal;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.3);
    margin-right: 0.6rem;
    font-family: 'Courier New', monospace;
  }
</style>
</head>
<body>

<img id="cover" src="images-ui-/bnbcvr.webp" alt="">

<div id="track-list">

  <a class="track-btn" href="young.mp3" download="young.mp3"><span class="track-num">03</span>young</a>
  <a class="track-btn" href="warble.mp3" download="warble.mp3"><span class="track-num">04</span>warble</a>
  <a class="track-btn" href="notheone.mp3" download="notheone.mp3"><span class="track-num">05</span>notheone</a>
  <a class="track-btn" href="dual.mp3" download="dual.mp3"><span class="track-num">06</span>dual</a>
  <a class="track-btn" href="sum1else.mp3" download="sum1else.mp3"><span class="track-num">07</span>sum1else</a>

</html>
