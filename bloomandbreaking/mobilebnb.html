<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>download</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    color: #f0ede8;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }

  #cover {
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    margin-bottom: 2rem;
  }

  #download-btn {
    width: 100%;
    max-width: 340px;
    padding: 1rem;
    background: none;
    border: 1px solid rgba(255,255,255,0.2);
    color: #f0ede8;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: border-color 0.3s, color 0.3s;
  }

  #download-btn:hover {
    border-color: rgba(255,255,255,0.6);
    color: #fff;
  }

  #download-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  #status {
    margin-top: 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.3);
    font-family: 'Courier New', monospace;
    min-height: 1.2em;
    text-align: center;
  }
</style>
</head>
<body>

<img id="cover" src="images-ui-/bnbcvr.webp" alt="">

<button id="download-btn">download</button>

<div id="status"></div>

<script>
const FILES = [
  "blond.mp3",
  "dual.mp3",
  "kickassspot.mp3",
  "notheone.mp3",
  "sum1else.mp3",
  "used_2.mp3",
  "warble.mp3",
  "young.mp3",
  "Screenshot 2025-11-10 at 11.21.57 PM.mp3",
];

const btn    = document.getElementById('download-btn');
const status = document.getElementById('status');

btn.addEventListener('click', async () => {
  btn.disabled = true;
  for (let i = 0; i < FILES.length; i++) {
    const file = FILES[i];
    status.textContent = `downloading ${i + 1} / ${FILES.length}…`;
    try {
      const res  = await fetch(file);
      if (!res.ok) throw new Error(`${res.status}`);
      const blob    = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href     = blobUrl;
      a.download = file;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
      // small gap between downloads so the browser doesn't batch-block them
      await new Promise(r => setTimeout(r, 800));
    } catch (err) {
      console.warn('failed:', file, err);
    }
  }
  status.textContent = 'done.';
  btn.disabled = false;
});
</script>
</body>
</html>
